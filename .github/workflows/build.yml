name: Build Firmware for JC3248W535

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run PlatformIO Build (Compile Target Binary)
        run: pio run -e jc3248w535

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v3
        with:
          name: jc3248w535-bruce-firmware
          path: .pio/build/jc3248w535/*.bin
